<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OXXY — Complete Women Store. Premium women's fashion and clothing." />
    <meta property="og:title" content="OXXY — Complete Women Store" />
    <meta property="og:description" content="Discover premium women's fashion at OXXY. New arrivals, exclusive collections, and timeless elegance." />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://oxxy.in/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="preconnect" href="https://oxxyclothing.onrender.com" />
    <link rel="dns-prefetch" href="https://oxxyclothing.onrender.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>OXXY — Complete Women Store</title>

    <style>
      #splash-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;transition:opacity .5s ease}
      #splash-loader.hide{opacity:0;pointer-events:none}
      #splash-loader .logo{font-family:Georgia,'Times New Roman',serif;font-size:2.5rem;letter-spacing:.25em;color:#050505;opacity:0;animation:fadeUp .6s ease forwards}
      #splash-loader .sub{font-family:system-ui,sans-serif;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:#a3a3a3;margin-top:.75rem;opacity:0;animation:fadeUp .6s ease .2s forwards}
      #splash-loader .bar{width:8rem;height:1px;background:#e5e5e5;margin-top:2rem;overflow:hidden;opacity:0;animation:fadeUp .6s ease .3s forwards}
      #splash-loader .bar::after{content:'';display:block;width:100%;height:100%;background:#050505;transform-origin:left;animation:barGrow 1.8s ease .5s forwards;transform:scaleX(0)}
      @keyframes fadeUp{to{opacity:1}}
      @keyframes barGrow{to{transform:scaleX(1)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash-loader">
        <span class="logo">OXXY</span>
        <span class="sub">Complete Women Store</span>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.__removeSplash = function() {
        var el = document.getElementById('splash-loader');
        if (el) {
          el.classList.add('hide');
          setTimeout(function() { el.remove(); }, 600);
        }
      };
      setTimeout(function() { window.__removeSplash(); }, 2500);
    </script>
  </body>
</html>
